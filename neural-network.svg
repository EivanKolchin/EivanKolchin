<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 90" width="100%" height="90" role="img" aria-label="Animated attention mechanism, focus sweeping across a sequence of tokens">
  <style>
    .edge {
      fill: none;
      stroke: #64748B;
      stroke-width: 1;
      opacity: 0.16;
      animation: edgePulse 4.8s ease-in-out infinite;
    }
    .token {
      rx: 2.5;
      transform-box: fill-box;
      transform-origin: center;
      animation: tokenPulse 4.8s ease-in-out infinite;
    }
    @keyframes edgePulse {
      0%, 100% { opacity: 0.16; stroke-width: 1; stroke: #64748B; filter: none; }
      6%       { opacity: 0.95; stroke-width: 2; stroke: #22D3EE; filter: drop-shadow(0 0 2px #22D3EE99); }
      18%      { opacity: 0.16; stroke-width: 1; stroke: #64748B; filter: none; }
    }
    @keyframes tokenPulse {
      0%, 100% { fill: #64748B; opacity: 0.6; transform: scale(1); filter: none; }
      6%       { fill: #22D3EE; opacity: 1; transform: scale(1.45); filter: drop-shadow(0 0 3px #22D3EE); }
      18%      { fill: #64748B; opacity: 0.6; transform: scale(1); filter: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .edge, .token { animation: none; opacity: 0.5; }
    }
  </style>

  <g class="edges">
    <path class="edge" d="M20,68 Q57,47.3 94,68"   style="animation-delay:0s"/>
    <path class="edge" d="M20,68 Q131,22 242,68"    style="animation-delay:0s"/>

    <path class="edge" d="M94,68 Q131,47.3 168,68"  style="animation-delay:0.6s"/>
    <path class="edge" d="M94,68 Q205,22 316,68"    style="animation-delay:0.6s"/>

    <path class="edge" d="M168,68 Q205,47.3 242,68" style="animation-delay:1.2s"/>
    <path class="edge" d="M168,68 Q279,22 390,68"   style="animation-delay:1.2s"/>

    <path class="edge" d="M242,68 Q279,47.3 316,68" style="animation-delay:1.8s"/>
    <path class="edge" d="M242,68 Q353,22 464,68"   style="animation-delay:1.8s"/>

    <path class="edge" d="M316,68 Q353,47.3 390,68" style="animation-delay:2.4s"/>
    <path class="edge" d="M316,68 Q427,22 538,68"   style="animation-delay:2.4s"/>

    <path class="edge" d="M390,68 Q427,47.3 464,68" style="animation-delay:3.0s"/>
    <path class="edge" d="M390,68 Q242,22 94,68"    style="animation-delay:3.0s"/>

    <path class="edge" d="M464,68 Q501,47.3 538,68" style="animation-delay:3.6s"/>
    <path class="edge" d="M464,68 Q316,22 168,68"   style="animation-delay:3.6s"/>

    <path class="edge" d="M538,68 Q464,27 390,68"   style="animation-delay:4.2s"/>
    <path class="edge" d="M538,68 Q353,22 168,68"   style="animation-delay:4.2s"/>
  </g>

  <g class="tokens">
    <rect class="token" x="16.5" y="64.5" width="7" height="7" style="animation-delay:0s"/>
    <rect class="token" x="90.5" y="64.5" width="7" height="7" style="animation-delay:0.6s"/>
    <rect class="token" x="164.5" y="64.5" width="7" height="7" style="animation-delay:1.2s"/>
    <rect class="token" x="238.5" y="64.5" width="7" height="7" style="animation-delay:1.8s"/>
    <rect class="token" x="312.5" y="64.5" width="7" height="7" style="animation-delay:2.4s"/>
    <rect class="token" x="386.5" y="64.5" width="7" height="7" style="animation-delay:3.0s"/>
    <rect class="token" x="460.5" y="64.5" width="7" height="7" style="animation-delay:3.6s"/>
    <rect class="token" x="534.5" y="64.5" width="7" height="7" style="animation-delay:4.2s"/>
  </g>
</svg>
