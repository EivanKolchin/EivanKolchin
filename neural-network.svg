<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 130" width="100%" height="130" role="img" aria-label="Animated neural network diagram, signal pulsing from input to output nodes">
  <style>
    .edge {
      stroke: #64748B;
      stroke-width: 1.2;
      fill: none;
      opacity: 0.4;
      stroke-dasharray: 4 7;
      animation: flow 2.6s linear infinite;
    }
    .node {
      fill: #0EA5E9;
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 2.4s ease-in-out infinite;
    }
    .node.out {
      fill: #22D3EE;
    }
    @keyframes flow {
      to { stroke-dashoffset: -33; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.35); }
    }
    @media (prefers-reduced-motion: reduce) {
      .edge, .node { animation: none; opacity: 0.85; }
    }
  </style>

  <g class="edges">
    <line class="edge" x1="50" y1="25" x2="320" y2="15" style="animation-delay:0s"/>
    <line class="edge" x1="50" y1="25" x2="320" y2="50" style="animation-delay:0.2s"/>
    <line class="edge" x1="50" y1="25" x2="320" y2="85" style="animation-delay:0.4s"/>
    <line class="edge" x1="50" y1="25" x2="320" y2="120" style="animation-delay:0.6s"/>
    <line class="edge" x1="50" y1="65" x2="320" y2="15" style="animation-delay:0.1s"/>
    <line class="edge" x1="50" y1="65" x2="320" y2="50" style="animation-delay:0.3s"/>
    <line class="edge" x1="50" y1="65" x2="320" y2="85" style="animation-delay:0.5s"/>
    <line class="edge" x1="50" y1="65" x2="320" y2="120" style="animation-delay:0.7s"/>
    <line class="edge" x1="50" y1="105" x2="320" y2="15" style="animation-delay:0.2s"/>
    <line class="edge" x1="50" y1="105" x2="320" y2="50" style="animation-delay:0.4s"/>
    <line class="edge" x1="50" y1="105" x2="320" y2="85" style="animation-delay:0.6s"/>
    <line class="edge" x1="50" y1="105" x2="320" y2="120" style="animation-delay:0.8s"/>
    <line class="edge" x1="320" y1="15" x2="590" y2="65" style="animation-delay:0.15s"/>
    <line class="edge" x1="320" y1="50" x2="590" y2="65" style="animation-delay:0.35s"/>
    <line class="edge" x1="320" y1="85" x2="590" y2="65" style="animation-delay:0.55s"/>
    <line class="edge" x1="320" y1="120" x2="590" y2="65" style="animation-delay:0.75s"/>
  </g>

  <g class="nodes">
    <circle class="node" cx="50" cy="25" r="5" style="animation-delay:0s"/>
    <circle class="node" cx="50" cy="65" r="5" style="animation-delay:0.3s"/>
    <circle class="node" cx="50" cy="105" r="5" style="animation-delay:0.6s"/>

    <circle class="node" cx="320" cy="15" r="5" style="animation-delay:0.15s"/>
    <circle class="node" cx="320" cy="50" r="5" style="animation-delay:0.45s"/>
    <circle class="node" cx="320" cy="85" r="5" style="animation-delay:0.75s"/>
    <circle class="node" cx="320" cy="120" r="5" style="animation-delay:1.05s"/>

    <circle class="node out" cx="590" cy="65" r="7" style="animation-delay:0.9s"/>
  </g>
</svg>
