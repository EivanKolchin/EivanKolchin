name: Refresh app icons

# Re-pulls the Kerfox and Axis icons from the live sites so the README's
# light and dark tiles follow whatever the apps actually ship.

on:
  schedule:
    - cron: "23 6 * * 1"   # Mondays, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - run: python scripts/refresh_icons.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- assets; then
            echo "icons unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Refresh app icons from live sites"
          git push
